---
# ESP32 HF-SFM Driver — app matrix for build scripts / CI
version: "1.0"

metadata:
  project: "ESP32 HF-SFM Driver Examples"
  default_app: "sfm_minimal_example"
  target: "esp32s3"
  idf_versions: ["release/v5.5", "release/v5.4"]
  build_types: [["Debug", "Release"], ["Debug"]]

apps:
  sfm_minimal_example:
    description: "SFM4300 §4: soft reset, product identifier, Air table, 1 Hz frame — I2C0 SDA=GPIO8 SCL=GPIO9 @400k"
    source_file: "sfm_minimal_example.cpp"
    category: "example"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true
    hardware_required: true
    features:
      - "Template `hf_sfm_examples::SfmEspIdfI2c` CRTP transport (no vtable)"
      - "Decode flow / temperature / status word with CRC-8 checks"

  sfm_flow_demo:
    description: "500 Hz poll with fixed-N=4 averaging; CO2 table when the variant has it, else Air; 1 s statistics"
    source_file: "sfm_flow_demo.cpp"
    category: "example"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true
    hardware_required: true
    features:
      - "Variant-aware gas selection via product identifier"
      - "NoData / CRC counters for bus-health observation"

build_config:
  build_types:
    Debug:
      description: "Debug build"
      cmake_build_type: "Debug"
      optimization: "-O0"
      debug_level: "-g3"
      defines: ["DEBUG"]

    Release:
      description: "Release build"
      cmake_build_type: "Release"
      optimization: "-O2"
      debug_level: "-g0"
      defines: ["NDEBUG"]

  build_directory_pattern: "build-app-{app_type}-type-{build_type}-target-{target}-idf-{idf_version}"
  project_name_pattern: "esp32_sfm_{app_type}_app"

ci_config:
  timeout_minutes: 30
  fail_fast: false
  exclude_combinations: []
  special_apps: []
